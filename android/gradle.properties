# Right-sized for this box (16GB, 4 cores). An 8G heap + 4G metaspace is a 12GB
# allowance for the daemon alone and was the top cause of OOM kills. Keep it modest.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1g
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
